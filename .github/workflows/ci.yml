name: ShipGate Context CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-forge-and-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, validate @forge/manifest, and test Forge app
        working-directory: forge-app
        run: |
          npm install
          npm run check

      - name: Install and build interactive web sandbox
        working-directory: web
        run: |
          npm install
          npm run build
